name: tile-remnant

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tile-remnant-api:0.1.0
    container_name: tile-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/tile_remnant.db}
      DATA_DIR: /data
      AUTO_CREATE_TABLES: "false"
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - tile_data:/data
    # 只绑本地回环，由宿主机上现成的 nginx 反代进来（见 docs/deployment.md）。
    # 这样不会去抢宿主机的 80/443，同一台机器上的其它站点（比如博客）可以共存。
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 25s

  nginx:
    image: nginx:1.27-alpine
    container_name: tile-nginx
    restart: unless-stopped
    # 默认不启动。要抢 80/443 只能有一个主人：机器上已经有 nginx 时（比如还跑着博客）
    # 就让宿主机那份直接反代 127.0.0.1:8000，别开这个服务。
    # 只有从零开始的干净机器、想整套容器化时才用：
    #   docker compose --profile standalone up -d
    profiles: ["standalone"]
    depends_on:
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/tile-api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/acme:/var/www/acme:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - edge

  # Optional PostgreSQL. Enable with:  docker compose --profile postgres up -d
  # then set DATABASE_URL=postgresql+psycopg://tile:${POSTGRES_PASSWORD}@db:5432/tile
  db:
    image: postgres:16-alpine
    container_name: tile-db
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tile}
      POSTGRES_USER: ${POSTGRES_USER:-tile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - tile_pgdata:/var/lib/postgresql/data
    networks:
      - edge
    # no host port: the database must never be reachable from the internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tile} -d ${POSTGRES_DB:-tile}"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  tile_data:
  tile_pgdata:
  nginx_cache:

networks:
  edge:
    driver: bridge
