# ---------------------------------------------------------------------------
# HTTPS reverse proxy for the tile-remnant API.
# Put the real certificate/key into ./deploy/certs/ (fullchain.pem, privkey.pem)
# or uncomment the certbot/acme block and issue one with webroot.
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=api_read:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=api_write:10m rate=2r/s;

upstream tile_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tiles.example.com;

    # Let's Encrypt / acme.sh webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tiles.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 65s;

    # Do not advertise the stack
    server_tokens off;

    access_log /var/log/nginx/tile-api.access.log;
    error_log  /var/log/nginx/tile-api.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # reads
    location ~ ^/api/(projects|devices)/.*$ {
        limit_req zone=api_read burst=20 nodelay;
        proxy_pass http://tile_api;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=api_read burst=20 nodelay;
        proxy_pass http://tile_api;
        proxy_read_timeout 30s;
    }

    location = /api/projects {
        limit_req zone=api_write burst=10 nodelay;
        proxy_pass http://tile_api;
    }

    location / {
        limit_req zone=api_read burst=20 nodelay;
        proxy_pass http://tile_api;
        proxy_read_timeout 30s;
    }

    # Block anything that looks like a direct database port / admin tool
    location ~ ^/(pgadmin|phpmyadmin|mysql|postgres) {
        return 404;
    }
}
